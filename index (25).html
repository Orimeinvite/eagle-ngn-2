<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EAGLE NGN</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0820;--card:#14122e;--line:#272352;--teal:#f6b93b;--gold:#ffd166;--txt:#f1eeff;--mut:#9a95c4;--red:#ff6b81}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(120% 60% at 50% -10%,#2a1b6b 0%,var(--bg) 60%) fixed;color:var(--txt);font-family:'Space Grotesk',system-ui,sans-serif;min-height:100vh;padding:18px 16px 110px}
h1{font-size:30px;font-weight:700}h2{font-size:20px;font-weight:600;margin-bottom:10px}
p,.mut{color:var(--mut);font-size:14px;line-height:1.45}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
.bal{background:linear-gradient(135deg,#4b2fd6 0%,#7b3fe4 55%,#b24be0 100%);border:0;box-shadow:0 10px 30px #5b34e055;position:relative;overflow:hidden}
.bal:before{content:"";position:absolute;right:-60px;top:-70px;width:200px;height:200px;border-radius:50%;background:#ffffff22}
.big{font-size:46px;font-weight:700;color:var(--gold);margin:4px 0 14px}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3 b{display:block;margin-top:3px}
.btn{border:0;border-radius:14px;padding:13px 16px;font:600 15px 'Space Grotesk',sans-serif;background:linear-gradient(135deg,#ffd166,#f59e0b);color:#2a1700;width:100%;cursor:pointer}
.btn.gold{background:linear-gradient(135deg,#ffd166,#f59e0b);color:#2a1700}.btn.ghost{background:#ffffff1f;color:#fff}.btn.line{background:var(--card);color:var(--txt);border:1px solid var(--line)}
.btn.sm{width:auto;padding:9px 16px;font-size:14px}.btn.red{background:var(--red);color:#2a0606}.btn:disabled{opacity:.5}
input,select,textarea{width:100%;background:#0d0b26;border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--txt);font:16px 'Space Grotesk',sans-serif;margin-bottom:10px}
textarea{min-height:90px;resize:vertical}
.tag{display:inline-block;background:#3a2c0b;color:var(--gold);border-radius:10px;padding:3px 9px;font-size:12px;font-weight:600}
.ok{color:#4ade9b}.gold{color:var(--gold)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0d0b28;border-top:1px solid var(--line);padding:10px 4px calc(12px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:#8f8ab8;font:500 12.5px 'Space Grotesk',sans-serif;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}
nav button.on{color:var(--teal)}nav svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ci{display:flex;align-items:center;gap:14px;margin-bottom:14px}.ci .ib{width:54px;height:54px;border-radius:16px;background:#2f2410;display:grid;place-items:center;flex:none}
.ci .ib svg{width:28px;height:28px;fill:none;stroke:var(--gold);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.gi svg{width:30px;height:30px;fill:none;stroke:var(--teal);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ci b{font-size:17px;white-space:nowrap}.ci .btn{width:auto;padding:11px 20px;border-radius:14px}
.ch{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.ic{width:46px;height:46px;border-radius:14px;background:#201c4d;display:grid;place-items:center;font-size:22px;flex:none}
.grow{flex:1;min-width:0;font-weight:600}
#toast{position:fixed;left:16px;right:16px;top:16px;background:#1d1946;border:1px solid var(--teal);border-radius:14px;padding:13px;z-index:9;display:none;font-size:14px}
.hero{text-align:center;padding:30px 0 10px}.hero .ic{width:92px;height:92px;border-radius:50%;font-size:48px;margin:0 auto 18px;background:#f6b93b26}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}.tabs button{flex:none}
img.pv{width:100%;border-radius:14px;margin:10px 0;max-height:240px;object-fit:cover}
.sub{margin-top:8px;font-size:13px}
</style>
</head>
<body>
<div id="toast"></div>
<div id="app"><p>Loading…</p></div>
<script>
const API="https://tksimbufnvjghlawfxum.supabase.co/functions/v1/eagle-api";
const BOT="EagleNGN_Official_bot";
const CH=[["EAGLE NGN","https://t.me/eaglecommi"],["EAGLE PAY","https://t.me/allverugf"],["SPONSOR","https://t.me/verifiedfreeupdates1"]];
const BANKS=["Access Bank","Citibank","Ecobank","Fidelity Bank","First Bank","FCMB","Globus Bank","GTBank","Heritage Bank","Keystone Bank","Kuda","Moniepoint","OPay","PalmPay","Polaris Bank","Providus Bank","Stanbic IBTC","Standard Chartered","Sterling Bank","Union Bank","UBA","Unity Bank","Wema Bank","Zenith Bank"];
const T=window.Telegram.WebApp;T.ready();T.expand();
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const N=v=>"₦"+Number(v||0).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2});
const IC={
home:'<svg viewBox="0 0 24 24"><path d="M3 11.2L12 3.5l9 7.7"/><path d="M5.5 9.8V20h13V9.8"/><path d="M10 20v-5.5h4V20"/></svg>',
tasks:'<svg viewBox="0 0 24 24"><path d="M3 5.5l1.8 1.8L8 4"/><path d="M11.5 6h9.5"/><path d="M3 12.5l1.8 1.8L8 11"/><path d="M11.5 13h9.5"/><path d="M11.5 20H17"/></svg>',
invite:'<svg viewBox="0 0 24 24"><circle cx="9" cy="7.5" r="3.5"/><path d="M2.5 20c0-3.7 2.8-6 6.5-6s6.5 2.3 6.5 6"/><path d="M15.5 4.3a3.3 3.3 0 010 6.4"/><path d="M18 14.3c2.2.7 3.5 2.6 3.5 5.7"/></svg>',
wallet:'<svg viewBox="0 0 24 24"><path d="M19 7V5.5A1.5 1.5 0 0017.5 4H5a2 2 0 00-2 2v11a3 3 0 003 3h12a2 2 0 002-2V9a2 2 0 00-2-2H5"/><circle cx="16.5" cy="13.5" r="1.1"/></svg>',
more:'<svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg>',
cal:'<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/><path d="M9 15l2 2 4-4"/></svg>'};
let S={},tab="home",AD={},at="wd",busy=false;
async function api(action,d={}){
  try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({initData:T.initData,action,...d})});return await r.json()}
  catch(e){return{error:"No connection. Check your internet and try again."}}
}
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._t);t._t=setTimeout(()=>t.style.display="none",3500)}
async function act(fn){if(busy)return;busy=true;try{await fn()}finally{busy=false}}
async function load(){const r=await api("me",{ref:T.initDataUnsafe.start_param});if(r.error){$("#app").innerHTML=`<div class="card"><h2>Can't open</h2><p>${esc(r.error)}</p></div>`;return}S=r;render()}
function go(t){tab=t;render();scrollTo(0,0)}
function openL(u){u.includes("t.me")?T.openTelegramLink(u):T.openLink(u)}

function render(){
  if(!S.joined){gate();return}
  const u=S.user,pages={home,tasks,invite,wallet,more,admin};
  $("#app").innerHTML=pages[tab]()+`<nav>${[["home","Home"],["tasks","Tasks"],["invite","Invite"],["wallet","Wallet"],["more","More"]].map(x=>`<button class="${tab==x[0]||(tab=="admin"&&x[0]=="more")?"on":""}" onclick="go('${x[0]}')">${IC[x[0]]}${x[1]}</button>`).join("")}</nav>`;
  if(tab=="wallet")calc();
  if(tab=="admin")adminLoad();
}

function gate(){
  $("#app").innerHTML=`<div class="hero"><div class="ic">🦅</div><h1>Join our channels to continue</h1><p style="margin:10px 0 22px">To use the app and start earning, please join all 3 channels below, then tap Verify.</p></div>
  ${CH.map((c,i)=>`<div class="ch"><div class="ic">✈️</div><div class="grow">${c[0]} ${i==2?'<span class="tag">Sponsor</span>':""}</div><button class="btn sm" onclick="openL('${c[1]}')">Join</button></div>`).join("")}
  <button class="btn gold" style="margin-top:14px" onclick="verify()">✔ I've joined — Verify</button>`;
}
function verify(){act(async()=>{const r=await api("verify");if(r.error)return toast(r.error);await load()})}

function ci(){const d=S.checked;return `<div class="card ci"><div class="ib">${IC.cal}</div><div class="grow"><b>Daily check-in</b><p>${d?"Done today. Come back tomorrow":"Claim ₦20.00 free today"}</p></div><button class="btn" ${d?"disabled":""} onclick="checkin()">${d?"Claimed ✓":"Claim"}</button></div>`}
function checkin(){act(async()=>{const r=await api("checkin");if(r.error)return toast(r.error);toast("You earned "+N(r.amount));await load()})}
function home(){const u=S.user;return `
<p class="gold" style="font-weight:600;letter-spacing:2px">EAGLE NGN 🦅</p><h1 style="margin-bottom:16px">Hi, ${esc(u.name)} 👋</h1>
<div class="card bal"><p style="color:#eadfff">Available balance</p><div class="big">${N(u.balance)}</div>
<div class="grid3"><div><p style="color:#eadfff">Pending</p><b>${N(S.pending)}</b></div><div><p style="color:#eadfff">Withdrawing</p><b>${N(S.withdrawing)}</b></div><div><p style="color:#eadfff">Total earned</p><b>${N(u.total_earned)}</b></div></div>
<button class="btn ghost" style="margin-top:18px" onclick="go('wallet')">Withdraw</button></div>
${ci()}
<div class="grid2"><div class="card" onclick="go('tasks')"><div class="gi">${IC.tasks}</div><h2 style="margin-top:12px">Do tasks</h2><p>Earn for simple actions</p></div>
<div class="card" onclick="go('invite')"><div class="gi">${IC.invite}</div><h2 style="margin-top:12px">Invite friends</h2><p>₦100.00 per friend</p></div></div>
${S.msg?`<div class="card"><div class="row"><span style="font-size:24px">📢</span><div><b>Message from Eagle NGN</b><p style="color:var(--txt);margin-top:4px">${esc(S.msg)}</p></div></div></div>`:""}`}

function tasks(){
  const g=(t,h)=>{const l=S.tasks.filter(x=>x.type==t);return l.length?`<h2 style="margin-top:6px">${h}</h2>`+l.map(card).join(""):""};
  return `<h1>Tasks</h1><p style="margin:6px 0 16px">Finish a task to earn. Telegram tasks pay instantly. Posts and WhatsApp tasks are paid after admin approval.</p>`+
   (S.tasks.length?g("telegram","Telegram tasks")+g("sponsored","Sponsored posts")+g("whatsapp","WhatsApp tasks"):`<div class="card"><p>No tasks right now. Check back soon.</p></div>`)+ci()}
function card(t){
  const d=S.done.includes(t.id),s=S.subs[t.id];let a="";
  if(d)a=`<p class="ok" style="font-weight:600">Done ✓ ${N(t.amount)} earned</p>`;
  else if(s=="pending")a=`<p class="gold" style="font-weight:600">Waiting for admin approval…</p>`;
  else if(t.type=="telegram")a=`<div class="row"><button class="btn line" onclick="openL('${esc(t.link)}')">Join channel</button><button class="btn" onclick="claim(${t.id})">Claim</button></div>`;
  else if(t.type=="whatsapp")a=(s=="rejected"?`<p style="color:var(--red)">Rejected. Send a clear screenshot again.</p>`:"")+`<div class="row"><button class="btn line" onclick="openL('${esc(t.link)}')">Join WhatsApp</button><button class="btn" onclick="proof(${t.id})">Send screenshot</button></div>`;
  else a=(s=="rejected"?`<p style="color:var(--red)">Rejected. Post again and send a clear screenshot.</p>`:"")+`${t.image?`<img class="pv" src="${esc(t.image)}">`:""}<div class="row">${t.image?`<button class="btn line" onclick="openL('${esc(t.image)}')">Download picture</button>`:""}<button class="btn line" onclick="copyT(${t.id})">Copy text</button></div><button class="btn" style="margin-top:10px" onclick="proof(${t.id})">Post it, then send screenshot</button>`;
  return `<div class="card"><div class="row sp"><b>${esc(t.title)}</b><span class="tag">${N(t.amount)}</span></div>${t.type=="sponsored"&&t.body?`<p class="sub">${esc(t.body)}</p>`:""}<div style="margin-top:12px">${a}</div></div>`}
function claim(id){act(async()=>{const r=await api("claim",{id});if(r.error)return toast(r.error);toast("You earned "+N(r.amount));await load()})}
function copyT(id){const t=S.tasks.find(x=>x.id==id);navigator.clipboard.writeText(t.body||"").then(()=>toast("Text copied. Paste it in your post."),()=>toast("Copy failed. Long-press the text instead."))}
function pick(cb){const i=document.createElement("input");i.type="file";i.accept="image/*";i.onchange=()=>{const f=i.files[0];if(!f)return;const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.6))};im.src=URL.createObjectURL(f)};i.click()}
function proof(id){pick(img=>act(async()=>{const r=await api("submit",{id,img});if(r.error)return toast(r.error);toast("Sent. Wait for admin approval.");await load()}))}

function invite(){const u=S.user,link=`https://t.me/${BOT}?startapp=${S.uid}`,q=S.refs.filter(x=>x.ref_paid).length;return `
<h1>Invite friends</h1><p style="margin:6px 0 16px">Earn ₦100.00 when a friend joins with your link and completes 3 tasks.</p>
<div class="card"><div class="row sp"><b>Your link</b><div style="text-align:right"><b style="font-size:28px">${S.refs.length}</b><p>invited</p></div></div>
<div style="background:#0d0b26;border-radius:14px;padding:14px;margin:12px 0;word-break:break-all"><p>Your code</p><b style="font-size:22px;letter-spacing:2px">${S.uid}</b><p style="margin-top:6px">${link}</p></div>
<div class="row"><button class="btn line" onclick="navigator.clipboard.writeText('${link}').then(()=>toast('Link copied'))">Copy link</button><button class="btn" onclick="T.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent('${link}')+'&text='+encodeURIComponent('Join EAGLE NGN 🦅 and earn naira!'))">Share</button></div></div>
<div class="grid3"><div class="card" style="text-align:center"><b style="font-size:24px">${S.refs.length}</b><p>Invited</p></div><div class="card" style="text-align:center"><b style="font-size:24px">${q}</b><p>Qualified</p></div><div class="card" style="text-align:center"><b class="gold" style="font-size:20px">${N(q*100)}</b><p>Earned</p></div></div>
<div class="card"><h2>Your friends</h2>${S.refs.length?S.refs.map(x=>`<div class="row sp" style="padding:8px 0;border-top:1px solid var(--line)"><span>${esc(x.name)}</span><span class="${x.ref_paid?"ok":"mut"}">${x.ref_paid?"Qualified":x.tasks_done+"/3 tasks"}</span></div>`).join(""):`<p>No one yet. Share your link to start earning!</p>`}</div>${ci()}`}

function wallet(){const u=S.user,b=u.bank;return `
<h1 style="margin-bottom:14px">Wallet</h1>
<div class="card bal"><p style="color:#eadfff">Available balance</p><div class="big">${N(u.balance)}</div><div class="grid3"><div><p style="color:#eadfff">Pending</p><b>${N(S.pending)}</b></div><div><p style="color:#eadfff">Withdrawing</p><b>${N(S.withdrawing)}</b></div><div><p style="color:#eadfff">Total earned</p><b>${N(u.total_earned)}</b></div></div></div>
<div class="card"><h2>Bank account</h2>
<select id="bk"><option value="">Choose your bank</option>${BANKS.map(x=>`<option ${b&&b.bank==x?"selected":""}>${x}</option>`).join("")}</select>
<input id="ac" inputmode="numeric" maxlength="10" placeholder="10-digit account number" value="${b?esc(b.acc):""}">
<input id="an" placeholder="Account name (as on your bank)" value="${b?esc(b.name):""}">
<button class="btn" onclick="saveBank()">Save bank account</button></div>
<div class="card"><h2>Withdraw</h2><input id="am" inputmode="numeric" placeholder="₦ Min 1,000.00" oninput="calc()">
<div class="row sp mut"><span id="fee">Fee 10%</span><span id="rec">You receive —</span></div>
<p class="ok" style="margin:10px 0;font-weight:600" onclick="$('#am').value=Math.floor(S.user.balance);calc()">Use full balance (${N(u.balance)})</p>
<button class="btn" id="wb" onclick="withdraw()">${b?"Withdraw":"Add a bank account first"}</button></div>
<div class="card"><h2>History</h2>${S.wd.length?S.wd.map(x=>`<div class="row sp" style="padding:8px 0;border-top:1px solid var(--line)"><span>${N(x.amount)}<br><span class="mut" style="font-size:12px">You get ${N(x.net)}</span></span><span class="${x.status=="paid"?"ok":x.status=="rejected"?"":"gold"}" style="${x.status=="rejected"?"color:var(--red)":""}">${x.status=="paid"?"Successful":x.status=="rejected"?"Rejected":"Pending"}</span></div>`).join(""):`<p>No withdrawals yet.</p>`}</div>`}
function calc(){const a=Number($("#am")?.value)||0;if(!$("#fee"))return;$("#fee").textContent="Fee "+(a?N(a*.1):"10%");$("#rec").textContent="You receive "+(a?N(a*.9):"—")}
function saveBank(){act(async()=>{const r=await api("save_bank",{bank:$("#bk").value,acc:$("#ac").value.trim(),name:$("#an").value});if(r.error)return toast(r.error);toast("Bank account saved");await load()})}
function withdraw(){act(async()=>{const a=Number($("#am").value);if(!S.user.bank)return toast("Add a bank account first.");if(a<1000)return toast("Minimum withdrawal is ₦1,000.");const r=await api("withdraw",{amount:a});if(r.error)return toast(r.error);toast("Withdrawal requested. 10% fee applied.");await load()})}

function more(){return `<h1 style="margin-bottom:14px">More</h1>
<div class="card"><h2>How it works</h2><p>1. Do Telegram, WhatsApp and sponsored post tasks.<br>2. Invite friends: ₦100 when they finish 3 tasks.<br>3. Withdraw from ₦1,000. A 10% fee is removed from each withdrawal.</p></div>
${S.admin?`<button class="btn gold" onclick="go('admin')">🛠 Admin dashboard</button>`:""}`}

/* ---------- admin ---------- */
function admin(){return `<h1 style="margin-bottom:12px">Admin</h1>
<div class="tabs">${[["wd","Withdrawals"],["sub","Approvals"],["usr","Users"],["tk","Tasks"],["bc","Broadcast"]].map(x=>`<button class="btn sm ${at==x[0]?"":"line"}" onclick="at='${x[0]}';adminDraw()">${x[1]}</button>`).join("")}</div><div id="ad"><p>Loading…</p></div>`}
async function adminLoad(){const r=await api("a_list");if(r.error)return toast(r.error);AD=r;adminDraw()}
function adminDraw(){
  const el=$("#ad");if(!el){return}
  document.querySelectorAll(".tabs button").forEach((b,i)=>b.className="btn sm "+(["wd","sub","usr","tk","bc"][i]==at?"":"line"));
  if(at=="wd")el.innerHTML=(AD.wd.length?AD.wd.map(w=>`<div class="card"><b>${N(w.amount)}</b> <span class="mut">(send ${N(w.net)})</span><p style="margin:6px 0">${esc(w.name)} · ID ${w.user_id}<br>${esc(w.bank.bank)} · ${esc(w.bank.acc)}<br>${esc(w.bank.name)}</p><div class="row"><button class="btn red" onclick="decide('a_wd',${w.id},0)">Reject</button><button class="btn" onclick="decide('a_wd',${w.id},1)">Paid ✓</button></div></div>`).join(""):`<div class="card"><p>No pending withdrawals.</p></div>`);
  if(at=="sub")el.innerHTML=(AD.subs.length?AD.subs.map(s=>`<div class="card"><b>${esc(s.task?.title||"Task")}</b> <span class="tag">${N(s.task?.amount)}</span><p>${esc(s.name)} · ID ${s.user_id}</p><img class="pv" src="${s.img}" style="max-height:360px;object-fit:contain"><div class="row"><button class="btn red" onclick="decide('a_sub',${s.id},0)">Reject</button><button class="btn" onclick="decide('a_sub',${s.id},1)">Approve</button></div></div>`).join(""):`<div class="card"><p>No screenshots waiting.</p></div>`);
  if(at=="usr")el.innerHTML=`<div class="card"><p>Total users: <b>${AD.users}</b></p><input id="tid" inputmode="numeric" placeholder="Telegram ID" style="margin-top:10px"><button class="btn" onclick="find()">Search user</button><div id="ur"></div></div>`;
  if(at=="tk")el.innerHTML=`<div class="card"><h2>Add task</h2><select id="tt" onchange="tkf()"><option value="telegram">Telegram channel task</option><option value="sponsored">Sponsored post</option><option value="whatsapp">WhatsApp task</option></select><input id="tl" placeholder="Title"><input id="ta" inputmode="numeric" placeholder="Amount (₦)"><input id="tk" placeholder="Join link (https://t.me/... or WhatsApp link)"><input id="tc" placeholder="Channel username, e.g. @mychannel (bot must be admin there)"><input id="ti" placeholder="Picture link (https://...)" style="display:none"><textarea id="tb" placeholder="Write-up people must copy and post" style="display:none"></textarea><button class="btn" onclick="addTask()">Add task</button></div>`+AD.tasks.map(t=>`<div class="card row sp"><div><b>${esc(t.title)}</b><p>${t.type} · ${N(t.amount)}</p></div><button class="btn red sm" onclick="delTask(${t.id})">Delete</button></div>`).join("");
  if(at=="bc")el.innerHTML=`<div class="card"><h2>Message everybody</h2><p style="margin-bottom:10px">Shows on every user's Home screen and is sent to them in the Eagle NGN bot.</p><textarea id="bm" placeholder="Write your message"></textarea><button class="btn" onclick="bcast()">Send to all</button></div>`;
}
function decide(a,id,ok){act(async()=>{const r=await api(a,{id,ok});if(r.error)toast(r.error);await adminLoad()})}
function find(){act(async()=>{const r=await api("a_find",{tid:$("#tid").value.trim()});userBox(r)})}
function userBox(r){$("#ur").innerHTML=r.error?`<p style="color:var(--red);margin-top:10px">${esc(r.error)}</p>`:`<div style="margin-top:14px"><b>${esc(r.user.name)}</b> · ID ${r.user.id}<p>Balance ${N(r.user.balance)} · Earned ${N(r.user.total_earned)} · Tasks ${r.user.tasks_done}</p><input id="aa" inputmode="numeric" placeholder="Amount to add (use - to remove)" style="margin-top:10px"><button class="btn gold" onclick="addMoney(${r.user.id})">Add money</button></div>`}
function addMoney(id){act(async()=>{const a=Number($("#aa").value);if(!a)return toast("Enter an amount");const r=await api("a_add",{tid:id,amount:a});userBox(r);if(!r.error)toast("Done. New balance "+N(r.user.balance))})}
function tkf(){const t=$("#tt").value;$("#tc").style.display=t=="telegram"?"block":"none";$("#ti").style.display=$("#tb").style.display=t=="sponsored"?"block":"none";$("#tk").style.display=t=="sponsored"?"none":"block"}
function addTask(){act(async()=>{const r=await api("a_task_add",{type:$("#tt").value,title:$("#tl").value,amount:$("#ta").value,link:$("#tk").value,chat:$("#tc").value.trim(),image:$("#ti").value.trim(),body:$("#tb").value});if(r.error)return toast(r.error);toast("Task added");await adminLoad()})}
function delTask(id){if(!confirm("Delete this task?"))return;act(async()=>{await api("a_task_del",{id});await adminLoad()})}
function bcast(){const t=$("#bm").value.trim();if(!t)return toast("Write a message");if(!confirm("Send to everybody?"))return;act(async()=>{const r=await api("a_bcast",{text:t});if(r.error)return toast(r.error);toast("Sent to "+r.sent+" users");$("#bm").value=""})}
load();
</script>
</body>
</html>
